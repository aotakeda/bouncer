<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%20width='64'%20height='64'%20fill='none'%3E%3Cdefs%3E%3ClinearGradient%20id='bt'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2322252b'/%3E%3Cstop%20offset='1'%20stop-color='%230b0c0e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='15'%20fill='url(%23bt)'/%3E%3Crect%20x='0.75'%20y='0.75'%20width='62.5'%20height='62.5'%20rx='14.25'%20stroke='%23ffffff'%20stroke-opacity='0.12'%20stroke-width='1.5'/%3E%3Cg%20transform='translate(32%2032)%20scale(1.7)%20translate(-12%20-12)'%3E%3Cpath%20transform='translate(2.1%20-1.4)%20scale(.84)%20translate(2.3%202.3)'%20d='M12%202.75%2019.25%205.4v5.85c0%204.9-3.05%208.35-7.25%2010-4.2-1.65-7.25-5.1-7.25-10V5.4Z'%20fill='%23f2f4f7'%20opacity='.42'/%3E%3Cpath%20transform='translate(-1.4%201.3)%20scale(.84)%20translate(2.3%202.3)'%20d='M12%202.75%2019.25%205.4v5.85c0%204.9-3.05%208.35-7.25%2010-4.2-1.65-7.25-5.1-7.25-10V5.4Z'%20fill='%23f2f4f7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<title>Bouncer · Sign in</title>
<style>
:root{--bg:#fbfbfc;--raise:#ffffff;--fg:#18191b;--mute:#6b6f76;--subtle:#9a9da3;--line:rgba(15,17,23,.075);--line-2:rgba(15,17,23,.13);--accent:#4f6bd8;--accent-fg:#ffffff;--ring:rgba(79,107,216,.22);--red:#d93f3f;--red-bg:rgba(217,63,63,.09);--ease-out:cubic-bezier(0.23,1,0.32,1);--sans:"Inter","InterVariable",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#08090a;--raise:#16171a;--fg:#f7f8f8;--mute:#8a8f98;--subtle:#5f636b;--line:rgba(255,255,255,.065);--line-2:rgba(255,255,255,.11);--accent:#7aa2ff;--accent-fg:#0b0d11;--ring:rgba(122,162,255,.25);--red:#eb5757;--red-bg:rgba(235,87,87,.13);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);font-feature-settings:"cv01","ss03";letter-spacing:-.003em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
main{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;opacity:1;transform:translateY(0);transition:opacity 300ms var(--ease-out),transform 300ms var(--ease-out)}
@starting-style{main{opacity:0;transform:translateY(6px)}}
.mark{width:44px;height:44px;border-radius:11px;background:linear-gradient(180deg,#22252b,#0b0c0e);color:#edf0f5;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.18);margin-bottom:20px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.018em;line-height:1.3}
.sub{margin:6px 0 28px;color:var(--mute);font-size:13.5px}
form{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input{width:100%;height:42px;font:inherit;font-size:16px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--raise);color:var(--fg);transition:border-color 150ms ease,box-shadow 150ms ease}
input::placeholder{color:var(--subtle)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input.bad{border-color:var(--red)}
input.bad:focus{box-shadow:0 0 0 3px var(--red-bg)}
button{width:100%;height:42px;font:inherit;font-size:14px;font-weight:550;border-radius:8px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 140ms var(--ease-out),filter 150ms ease}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover) and (pointer:fine){button:hover{filter:brightness(1.08)}}
.err{display:flex;align-items:center;gap:8px;margin:0;padding:8px 12px;border-radius:8px;background:var(--red-bg);color:var(--red);font-weight:500}
.err svg{flex-shrink:0}
.foot{margin-top:28px;color:var(--subtle);font-size:12px}
@media (prefers-reduced-motion:reduce){main{transition:opacity 180ms ease;transform:none}@starting-style{main{opacity:0;transform:none}}button:active{transform:none}}
</style></head>
<body><main>
  <span class="mark" aria-hidden="true"><svg class="ic" width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path transform="translate(2.1 -1.4) scale(.84) translate(2.3 2.3)" d="M12 2.75 19.25 5.4v5.85c0 4.9-3.05 8.35-7.25 10-4.2-1.65-7.25-5.1-7.25-10V5.4Z" fill="currentColor" opacity=".42"/><path transform="translate(-1.4 1.3) scale(.84) translate(2.3 2.3)" d="M12 2.75 19.25 5.4v5.85c0 4.9-3.05 8.35-7.25 10-4.2-1.65-7.25-5.1-7.25-10V5.4Z" fill="currentColor"/></svg></span>
  <h1>Sign in to Bouncer</h1>
  <p class="sub">OWASP Juice Shop</p>
  <form method="post" action="login">
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" name="passphrase" placeholder="What's the password?" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required autofocus$err_attr>
    $err_block
    <button type="submit">Continue</button>
  </form>
  <p class="foot">Use the dashboard passphrase.</p>
</main></body></html>
