<title>Bouncer</title>
<style>
:root{
  --bg:#fbfaf7;
  --side:#f4f2ee;
  --panel:#ffffff;
  --raise:#ffffff;
  --glass:rgba(251,250,247,.86);
  --hover:rgba(40,30,15,.035);
  --sel:rgba(40,30,15,.06);
  --line:rgba(40,30,15,.08);
  --line-2:rgba(40,30,15,.14);
  --fg:#1a1814;
  --fg-2:#3d3933;
  --mute:#6f6a61;
  --subtle:#9e988d;
  --accent:#9a6210;
  --accent-fg:#ffffff;
  --accent-bg:rgba(154,98,16,.1);
  --focus:#9a6210;
  --red:#d93f3f;--red-bg:rgba(217,63,63,.09);
  --orange:#d2601a;--orange-bg:rgba(210,96,26,.1);
  --yellow:#c08f00;--yellow-bg:rgba(192,143,0,.1);
  --green:#2f9a63;--green-bg:rgba(47,154,99,.1);
  --bar-allowed:rgba(40,30,15,.11);--bar-slowed:#d2601a;--bar-blocked:#d93f3f;
  --diff-add-bg:rgba(47,154,99,.09);--diff-del-bg:rgba(217,63,63,.08);--diff-hunk:#9a6210;--diff-hunk-bg:rgba(154,98,16,.06);
  --syn-kw:#8250df;--syn-str:#0a3069;--syn-fn:#6639ba;--syn-num:#953800;--syn-type:#0550ae;--syn-cm:#656d76;--syn-op:#57606a;--syn-var:#953800;
  --shadow-pop:0 8px 28px rgba(15,17,23,.12),0 1px 3px rgba(15,17,23,.06),0 0 0 1px var(--line-2);
  --shadow-drawer:-12px 0 32px rgba(15,17,23,.1);
  --scrim:rgba(15,17,23,.28);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side-w:232px;
  --peek-w:480px;
  --top:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0a09;
  --side:#0f0e0c;
  --panel:#131210;
  --raise:#1a1916;
  --glass:rgba(11,10,9,.82);
  --hover:rgba(255,245,230,.035);
  --sel:rgba(255,245,230,.06);
  --line:rgba(255,245,230,.07);
  --line-2:rgba(255,245,230,.12);
  --fg:#f5f2ed;
  --fg-2:#d8d2c8;
  --mute:#938d83;
  --subtle:#615c54;
  --accent:#e2b25e;
  --accent-fg:#17120a;
  --accent-bg:rgba(226,178,94,.13);
  --focus:#e2b25e;
  --red:#eb5757;--red-bg:rgba(235,87,87,.13);
  --orange:#f07f3f;--orange-bg:rgba(240,127,63,.13);
  --yellow:#f2c94c;--yellow-bg:rgba(242,201,76,.12);
  --green:#4cb782;--green-bg:rgba(76,183,130,.13);
  --bar-allowed:rgba(255,245,230,.1);--bar-slowed:#f07f3f;--bar-blocked:#eb5757;
  --diff-add-bg:rgba(76,183,130,.1);--diff-del-bg:rgba(235,87,87,.1);--diff-hunk:#e2b25e;--diff-hunk-bg:rgba(226,178,94,.08);
  --syn-kw:#d2a8ff;--syn-str:#a5d6ff;--syn-fn:#c4b5fd;--syn-num:#ffa657;--syn-type:#79c0ff;--syn-cm:#7c8496;--syn-op:#8b949e;--syn-var:#ffa657;
  --shadow-pop:0 16px 48px rgba(0,0,0,.55),0 0 0 1px var(--line-2);
  --shadow-drawer:-16px 0 44px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}}
@media (prefers-contrast:more){:root{--line:rgba(15,17,23,.24);--line-2:rgba(15,17,23,.4);--mute:#4c5057;--glass:var(--bg)}}
@media (prefers-color-scheme:dark) and (prefers-contrast:more){:root{--line:rgba(255,255,255,.22);--line-2:rgba(255,255,255,.36);--mute:#b4b9c2;--glass:var(--bg)}}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 var(--sans);
  letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:var(--accent)}
button,a,[role="button"]{touch-action:manipulation}
button,.btn,.chip,.nav,.live,.mi,.kit{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:4px}
svg.ic{display:block;flex-shrink:0}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
.mute{color:var(--mute)}
.small{font-size:12px}
.grow{flex:1;min-width:8px}
.num,.tnum{font-variant-numeric:tabular-nums}
mark{background:var(--red-bg);color:var(--red);border-radius:3px;padding:0 2px}
kbd{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 4px;
  font:500 11px/1 var(--sans);color:var(--mute);
  border:1px solid var(--line-2);border-radius:4px;background:var(--panel);
}

.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;min-height:100dvh;transition:grid-template-columns 240ms var(--ease-drawer)}
@media (min-width:761px){
.app.side-hidden{grid-template-columns:52px minmax(0,1fr)}
.app.side-hidden .side{overflow:hidden;padding-left:8px;padding-right:8px;align-items:stretch}
.app.side-hidden .ws{justify-content:center;padding:6px 0}
.app.side-hidden .brand,.app.side-hidden .env,.app.side-hidden .search span,.app.side-hidden .search kbd,.app.side-hidden .live-ago,.app.side-hidden .live-badge{display:none}
.app.side-hidden .search{justify-content:center;padding:7px 0}
.app.side-hidden .nav-h{font-size:0;padding:0;height:1px;margin:10px 6px;background:var(--line)}
.app.side-hidden .nav{position:relative;justify-content:center;padding:7px 0;font-size:0;gap:0}
.app.side-hidden .nav .n{display:none}
.app.side-hidden .nav .n.hot{display:block;position:absolute;top:5px;right:7px;width:6px;height:6px;margin:0;border-radius:50%;background:var(--red);font-size:0;box-shadow:0 0 0 2px var(--side)}
.app.side-hidden .live{justify-content:center;padding:7px 0;font-size:0;gap:0}
}
@media (prefers-reduced-motion:reduce){.app{transition:none}}

.side{
  position:sticky;top:0;height:100vh;height:100dvh;
  background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;
  padding:max(10px,env(safe-area-inset-top,0px)) 8px max(10px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  z-index:15;
}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px;min-width:0}
.brand-mark{width:20px;height:20px;border-radius:5px;background:linear-gradient(180deg,#2a2621,#0d0c0a);color:#f3efe8;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand{font-weight:600;letter-spacing:-.01em}
.env{margin-left:auto;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{
  display:flex;align-items:center;gap:8px;
  margin:6px 0 8px;padding:5px 6px 5px 8px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--mute);
  transition:border-color 150ms ease,color 150ms ease;
}
.search span{flex:1;text-align:left}
.navs{display:flex;flex-direction:column;gap:1px}
.nav-h{color:var(--subtle);font-size:11.5px;font-weight:550;padding:14px 8px 4px}
.nav{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:5px 8px;border-radius:6px;
  color:var(--fg-2);font-weight:500;
  transition:background-color 120ms ease,color 120ms ease;
}
.nav .ic{color:var(--mute)}
.nav[aria-current="true"]{background:var(--sel);color:var(--fg)}
.nav[aria-current="true"] .ic{color:var(--accent)}
.nav .n{margin-left:auto;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.nav .n.hot{color:var(--red);font-weight:550}
.live{
  margin-top:auto;display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 8px;border-radius:6px;color:var(--fg-2);font-size:12px;font-weight:500;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  transition:background-color 120ms ease;
}
.live-ic{width:14px;height:14px;display:grid;place-items:center;color:var(--green);flex-shrink:0}
.live-ic .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2.4s var(--ease-out) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--green-bg)}70%{box-shadow:0 0 0 5px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live[aria-pressed="false"] .live-ic{color:var(--mute)}
.live.off .live-ic{color:var(--orange)}
.live-ago{margin-left:auto;color:var(--subtle);font-weight:450}
.live-badge{background:var(--accent-bg);color:var(--accent);padding:0 6px;border-radius:99px;font-size:11px;font-weight:600;line-height:1.6}

.main{min-width:0;padding-bottom:max(64px,env(safe-area-inset-bottom,0px));transition:margin-right 280ms var(--ease-drawer)}
.banner{
  display:flex;align-items:center;gap:10px;margin:12px 20px 0 24px;
  background:var(--orange-bg);color:var(--orange);
  border-radius:8px;padding:8px 12px;font-weight:500;
}
.sect{scroll-margin-top:var(--top)}
.sh{
  position:sticky;top:var(--top);z-index:5;
  display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;
  min-height:44px;padding:6px 20px 6px 24px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);
  border-bottom:1px solid var(--line);
}
.sect+.sect .sh{border-top:1px solid var(--line)}
@media (prefers-reduced-transparency:reduce){.sh{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
.sh h2{margin:0 6px 0 0;min-width:96px;font-size:14px;font-weight:600;letter-spacing:-.01em}
.sh-sub{color:var(--mute);font-size:12px}

.chips{display:flex;gap:2px;flex-wrap:wrap}
.chips .chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;
  padding:0 9px;border-radius:6px;border:1px solid transparent;
  color:var(--mute);font-weight:500;font-size:12.5px;white-space:nowrap;
  transition:color 120ms ease,background-color 120ms ease,border-color 120ms ease;
}
.chips .chip b{font-weight:500;color:var(--subtle);font-variant-numeric:tabular-nums}
.chips .chip[aria-pressed="true"]{color:var(--fg);background:var(--raise);border-color:var(--line-2);box-shadow:0 1px 1px rgba(0,0,0,.04)}
.chips .chip[aria-pressed="true"] b{color:var(--mute)}

.chip{
  display:inline-flex;align-items:center;gap:5px;height:22px;
  padding:0 8px;border:1px solid var(--line-2);border-radius:11px;
  color:var(--fg-2);font-size:12px;font-weight:500;white-space:nowrap;text-decoration:none;
  font-variant-numeric:tabular-nums;flex-shrink:0;
}
.chip .ic{width:12px;height:12px}
.chip.mono{font-family:var(--mono);font-size:11.5px;color:var(--mute);font-weight:400}
a.chip{transition:border-color 120ms ease,background-color 120ms ease}

.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:550;white-space:nowrap}
.oc-blocked{background:var(--red-bg);color:var(--red)}
.fx-done{background:var(--green-bg);color:var(--green)}
.fx-fail{background:var(--orange-bg);color:var(--orange)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:28px;padding:0 10px;border-radius:6px;
  border:1px solid var(--line-2);background:var(--raise);color:var(--fg);
  font-size:12.5px;font-weight:500;white-space:nowrap;text-decoration:none;flex-shrink:0;
  box-shadow:0 1px 1px rgba(0,0,0,.04);
}
.btn .ic{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.btn.subtle{height:24px;padding:0 8px;background:transparent;border-color:transparent;box-shadow:none;color:var(--mute);font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.ib{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--mute);flex-shrink:0;position:relative}
.ib::before{content:"";position:absolute;inset:-4px}

.btn,.chips .chip,.ib,.nav,.live,.pick,.mi,.kit,.search{transition:transform 140ms var(--ease-out),background-color 120ms ease,border-color 120ms ease,color 120ms ease,opacity 150ms ease,filter 150ms ease}
.btn:active:not(:disabled),.chips .chip:active,.ib:active,.live:active,.pick:active{transform:scale(.97)}
.srow,.erow{transition:background-color 100ms ease}
.srow:active,.erow:active{background:var(--sel)}

@media (hover:hover) and (pointer:fine){
  .search:hover{border-color:var(--line-2);color:var(--fg-2)}
  .nav:hover,.live:hover{background:var(--hover)}
  .nav:hover{color:var(--fg)}
  .chips .chip:hover{color:var(--fg)}
  .btn:hover:not(:disabled){background:var(--hover);border-color:var(--line-2)}
  .btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
  .btn.subtle:hover:not(:disabled){color:var(--fg);background:var(--hover)}
  .ib:hover{background:var(--hover);color:var(--fg)}
  a.chip:hover{background:var(--hover);border-color:var(--line-2)}
  .srow:hover,.erow:hover{background:var(--hover)}
  .srow.sel:hover,.erow.sel:hover{background:var(--sel)}
  .pick:hover{background:var(--hover)}
  .link-card:hover{background:var(--hover);border-color:var(--line-2)}
  .col:hover rect.hit{fill:var(--hover)}
  .crumb-a:hover{color:var(--fg)}
}

.grp{
  display:flex;align-items:center;gap:10px;height:30px;
  padding:0 20px 0 24px;background:var(--side);
  border-bottom:1px solid var(--line);font-size:12px;font-weight:500;color:var(--fg-2);
}
.grp .ic{width:14px;height:14px}
.grp>.ic,.grp-t>.ic:first-child{margin:0 1px}
.grp-n{color:var(--mute);font-weight:450;font-variant-numeric:tabular-nums}
.grp-d{color:var(--subtle);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grp-d::before{content:"·";margin-right:8px}
.srow{
  position:relative;
  display:grid;grid-template-columns:16px 48px minmax(0,1fr) auto;gap:10px;align-items:center;
  min-height:40px;padding:0 20px 0 24px;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.srow.sel{background:var(--sel)}
.srow.sel::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.grp-t{display:flex;align-items:center;gap:10px;width:100%;height:100%;min-width:0;color:var(--fg-2);font-weight:500}
.grp-t .chev{margin-left:2px;transition:transform 160ms var(--ease-out)}
.grp-t[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sevi{display:inline-grid;place-items:center;width:16px;height:16px}
.sid{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stitle{display:flex;align-items:center;gap:8px;min-width:0}
.sti{display:inline-grid;place-items:center;flex-shrink:0}
.st-t{font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:120px}
.st-n{color:var(--mute);font-variant-numeric:tabular-nums;flex-shrink:0}
.st-s{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 100 auto;min-width:0}
.sprops{display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:0}
.when{color:var(--mute);font-size:12px;width:40px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.empty{padding:20px 24px;color:var(--mute);line-height:1.5}

.fresh-tint{position:absolute;inset:0;pointer-events:none;background:var(--accent-bg);opacity:0;animation:freshFade 900ms var(--ease-out) both}
@keyframes freshFade{from{opacity:1}to{opacity:0}}

.brow{
  display:flex;align-items:center;gap:10px;
  min-height:44px;padding:6px 20px 6px 24px;border-bottom:1px solid var(--line);
}
.brow-body{flex:1;min-width:0;display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
.brow-ip{font-weight:500;color:var(--fg);min-width:15ch}
.brow-kind{font-weight:500;min-width:58px}
.brow-kind.k-block{color:var(--red)}
.brow-kind.k-tarpit{color:var(--orange)}
.brow-meta{color:var(--mute);font-size:12px;min-width:0;overflow-wrap:anywhere}

.totals{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.totals span{display:inline-flex;align-items:center;gap:5px}
.totals b{color:var(--fg);font-weight:550;font-variant-numeric:tabular-nums}
.swatch{width:7px;height:7px;border-radius:2px;display:inline-block;flex-shrink:0}
.seg{
  position:relative;display:grid;grid-template-columns:repeat(4,1fr);
  padding:2px;border-radius:7px;border:1px solid var(--line-2);margin-left:auto;min-width:168px;
}
.seg-thumb{
  position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / 4);
  border-radius:5px;background:var(--sel);pointer-events:none;
  transition:transform 200ms var(--ease-out);
}
.seg.instant .seg-thumb{transition:none}
.seg button{position:relative;z-index:1;padding:2px 8px;border-radius:5px;color:var(--mute);font-size:12px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{color:var(--fg)}
.chartwrap{padding:16px 20px 10px 24px;display:flex;flex-direction:column;gap:6px}
.chart{position:relative;height:92px;padding-top:20px;user-select:none;-webkit-user-select:none}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.chart .ymax{position:absolute;left:0;top:0;font-size:11px;color:var(--subtle);font-variant-numeric:tabular-nums;line-height:1.2;pointer-events:none}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12px;pointer-events:none}

const clock=ts=>ts?new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';

function ago(ts){
  if(!ts)return '';
  const d=Math.max(0,Math.round(Date.now()/1000-ts));
  if(d<10)return 'just now';
  if(d<60)return rtf.format(-d,'second');
  if(d<3600)return rtf.format(-Math.round(d/60),'minute');
  if(d<86400)return rtf.format(-Math.round(d/3600),'hour');
  if(d<7*86400)return rtf.format(-Math.round(d/86400),'day');
  return new Date(ts*1000).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});
}
function fmtLeft(s){
  s=Math.max(0,Math.round(Number(s)||0));
  if(s===0)return 'Expiring now';
  if(s<60)return `${s} ${plural(s,'second','seconds')} left`;
  if(s<3600)return `${Math.ceil(s/60)} min left`;
  if(s<86400){const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return m?`${h}h ${m}m left`:`${h}h left`}
  const d=Math.floor(s/86400),h=Math.round((s%86400)/3600);
  return h?`${d}d ${h}h left`:`${d}d left`;
}
function fmtDur(d){
  d=Math.max(0,Math.round(d));
  if(d<60)return d+'s';
  if(d<3600)return Math.floor(d/60)+'m '+(d%60)+'s';
  if(d<86400)return Math.floor(d/3600)+'h '+Math.round((d%3600)/60)+'m';
  return Math.floor(d/86400)+'d '+Math.round((d%86400)/3600)+'h';
}
function freshTint(key){

  return `<span class="fresh-tint" style="animation-delay:-${e}ms" aria-hidden="true"></span>`;
}
function decode(s){s=String(s??'');try{return decodeURIComponent(s.replace(/\+/g,' '))}catch(e){return s}}
function decodePath(p){p=String(p??'');const i=p.indexOf('?');return i<0?decode(p):decode(p.slice(0,i))+'?'+decode(p.slice(i+1))}

function outcomeOf(e){
  const d=e.decision;
  if(d==='block')return ['blocked','Blocked'];
  if(d==='tarpit')return ['slowed','Slowed'];
  if(d==='would_block')return ['owner','Would block (you)'];
  if(d==='would_tarpit')return ['owner','Would slow (you)'];
  if(d==='replay')return ['testing','Testing'];
  if(d==='error')return ['error','Error'];
  return ['allowed','Allowed'];
}

function requests(){
  const by=new Map();
  for(const e of S.recent||[]){
    if(e.kind==='fix'||e.decision==='fix')continue;
    const key=e.rid||`${e.ts}|${e.ip}|${e.path}`;
    const prev=by.get(key);
    if(!prev){by.set(key,{...e,first:e.ts,steps:[e]});continue}
    const sevs=[prev.severity,e.severity].filter(Boolean).sort((a,b)=>SEV.indexOf(a)-SEV.indexOf(b));
    by.set(key,{...prev,...e,first:prev.first,severity:sevs[0]||e.severity,verdict:e.verdict||prev.verdict,why:e.why||prev.why,malicious:e.malicious??prev.malicious,jev_action:e.jev_action??prev.jev_action,confidence:e.confidence??prev.confidence,steps:[...prev.steps,e]});
  }
  return [...by.values()].sort((a,b)=>b.first-a.first);
}

/* Non-destructive range control (mounted once, GPU-only sliding thumb) */
function initRange(){
  const el=$('range');
  if(el.childElementCount)return;
  el.innerHTML='<span class="seg-thumb" aria-hidden="true"></span>'+RANGES.map(r=>`<button type="button" data-range="${r[0]}" aria-pressed="false">${r[0]}</button>`).join('');
}
function syncRange(instant){
  initRange();
  const el=$('range');
  el.classList.toggle('instant',Boolean(instant||reduceMotion()));
  const idx=Math.max(0,RANGES.findIndex(r=>r[0]===ui.range));
  el.querySelectorAll('button[data-range]').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===idx)));
  const thumb=el.querySelector('.seg-thumb');
  if(thumb)thumb.style.transform=`translateX(${idx*100}%)`;
}

/* Non-destructive filter chip updates (preserves focus & :active during SSE) */
function syncChips(container,keys,labels,counts,active,attr){
  const existing=container.querySelectorAll(`button[data-${attr}]`);
  if(existing.length!==keys.length){
    container.innerHTML=keys.map(k=>`<button type="button" class="chip" data-${attr}="${k}" aria-pressed="${active===k}"><span>${esc(labels[k])}</span><b>${fmtN(counts[k]||0)}</b></button>`).join('');
    return;
  }
  existing.forEach((btn,i)=>{
    const k=keys[i];
    btn.setAttribute('aria-pressed',String(active===k));
    const b=btn.querySelector('b');
    const txt=fmtN(counts[k]||0);
    if(b&&b.textContent!==txt)b.textContent=txt;
  });
}

/* Chart hover tooltip with instant subsequent hovers (Emil tooltip pattern) */
let chartBuckets=[];
let tipState={open:false,active:-1,closeTimer:null};
function hideTip(){
  const tip=$('ctip');
  if(!tip)return;
  tip.classList.remove('show');
  tip.removeAttribute('data-instant');
  const prev=$('chart').querySelector('.col.active');
  if(prev)prev.classList.remove('active');
  tipState.active=-1;
  clearTimeout(tipState.closeTimer);
  tipState.closeTimer=setTimeout(()=>{tipState.open=false},140);
}
function showTip(index){
  const b=chartBuckets[index];
  const wrap=$('chart'),tip=$('ctip');
  if(!b||!wrap||!tip)return;
  clearTimeout(tipState.closeTimer);
  const wasOpen=tipState.open&&tipState.active!==-1;
  tip.toggleAttribute('data-instant',wasOpen);
  const prev=wrap.querySelector('.col.active');
  if(prev)prev.classList.remove('active');
  const col=wrap.querySelector(`.col[data-idx="${index}"]`);
  if(col)col.classList.add('active');
  tip.innerHTML=`<div class="ctip-t">${esc(b.label)}</div>
    <div class="ctip-rows">
      <span class="swatch" style="background:var(--bar-blocked)"></span><span class="mute">Blocked</span><b>${fmtN(b.blocked)}</b>
      <span class="swatch" style="background:var(--bar-slowed)"></span><span class="mute">Slowed</span><b>${fmtN(b.slowed)}</b>
      <span class="swatch" style="background:var(--bar-allowed)"></span><span class="mute">Allowed</span><b>${fmtN(b.allowed)}</b>
    </div>`;
  const w=wrap.clientWidth||1;
  const cx=b.pct*w;
  const placeLeft=cx>w*0.55;
  tip.classList.toggle('left',placeLeft);
  const gapPx=12;
  const tipW=tip.offsetWidth||164;
  const x=placeLeft?Math.max(tipW+4,cx-gapPx):Math.min(w-tipW-4,cx+gapPx);
  tip.style.left=x+'px';
  tip.classList.add('show');
  tipState.open=true;
  tipState.active=index;
}

function renderTraffic(instantRange){
  const [,span,step]=rangeDef();
  const now=Date.now()/1000;
  const end=Math.ceil(now/step)*step,start=end-span,n=Math.round(span/step);
  const cols=Array.from({length:n},()=>[0,0,0]);
  for(const [ts,a,sl,b] of S.traffic||[]){
    if(ts<start||ts>=end)continue;
    const i=Math.floor((ts-start)/step);
    if(i<0||i>=n)continue;
    cols[i][0]+=a;cols[i][1]+=sl;cols[i][2]+=b;
  }
  const tot=cols.reduce((t,c)=>[t[0]+c[0],t[1]+c[1],t[2]+c[2]],[0,0,0]);
  const all=tot[0]+tot[1]+tot[2];
  $('totals').innerHTML=
    `<span><b>${fmtN(all)}</b>${plural(all,'request','requests')}</span>`+
    `<span><i class="swatch" style="background:var(--bar-blocked)"></i><b>${fmtN(tot[2])}</b>blocked</span>`+
    `<span><i class="swatch" style="background:var(--bar-slowed)"></i><b>${fmtN(tot[1])}</b>slowed</span>`;
  syncRange(instantRange);
  const max=Math.max(1,...cols.map(c=>c[0]+c[1]+c[2]));
  const W=1000,H=100,topPad=14,gap=n>40?2:4,bw=Math.max(2,W/n-gap);
  const hm={hour:'2-digit',minute:'2-digit',hourCycle:'h23'};
  const fmt=ts=>span>86400?new Date(ts*1000).toLocaleDateString([], {month:'short',day:'numeric'}):new Date(ts*1000).toLocaleTimeString([], hm);
  const fmtFull=ts=>span>86400?new Date(ts*1000).toLocaleString([], {month:'short',day:'numeric',...hm}):new Date(ts*1000).toLocaleTimeString([], hm);
  chartBuckets=[];
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${fmtN(all)} requests: ${fmtN(tot[2])} blocked, ${fmtN(tot[1])} slowed, ${fmtN(tot[0])} allowed">`;
  svg+=`<line x1="0" x2="${W}" y1="${H-.5}" y2="${H-.5}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`;
  cols.forEach((c,i)=>{
    const x=i*(W/n)+gap/2;
    let y=H;
    const sum=c[0]+c[1]+c[2];
    const bStart=start+i*step;
    chartBuckets.push({label:`${fmtFull(bStart)} – ${fmtFull(bStart+step)}`,allowed:c[0],slowed:c[1],blocked:c[2],total:sum,pct:(x+bw/2)/W});
    svg+=`<g class="col" data-idx="${i}"><rect class="hit" x="${i*(W/n)}" y="0" width="${W/n}" height="${H}" fill="transparent"/>`;
    [[c[0],'var(--bar-allowed)'],[c[1],'var(--bar-slowed)'],[c[2],'var(--bar-blocked)']].forEach(([v,f])=>{
      if(!v)return;
      const h=Math.max(2,v/max*(H-topPad-2));
      y-=h;
      svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${f}"/>`;
    });
    svg+='</g>';
  });
  svg+='</svg>';
  const emptyNote=ui.loaded&&all===0?`<div class="chart-empty">No traffic in the last ${esc(ui.range)}</div>`:'';
  $('chart').innerHTML=svg+(all>0?`<span class="ymax">${fmtN(max)}</span>`:'')+emptyNote+'<div class="ctip" id="ctip" role="tooltip"></div>';
  $('axis').innerHTML=[0,1,2,3].map(k=>`<span>${fmt(start+span*k/3)}</span>`).join('');
  tipState.open=false;tipState.active=-1;
  renderEvents(start);
}

const KW_COMMON=new Set(['if','else','for','while','do','switch','case','default','break','continue','return','try','catch','finally','throw','new','in','of','as','is','async','await','class','extends','import','from','export','function','const','let','var','typeof','instanceof','void','delete','yield','interface','type','enum','implements','public','private','protected','readonly','static','abstract','declare','namespace','module']);
const KW_PY=new Set(['def','class','return','if','elif','else','for','while','break','continue','pass','try','except','finally','raise','with','as','import','from','lambda','yield','async','await','and','or','not','in','is','global','nonlocal','del','assert']);
const KW_SQL=new Set(['select','from','where','and','or','not','in','is','null','like','ilike','order','by','group','having','limit','offset','union','all','join','left','right','inner','outer','on','as','insert','into','values','update','set','delete','create','table','drop','alter','distinct','case','when','then','else','end','asc','desc']);
const LIT_SET=new Set(['true','false','null','undefined','NaN','Infinity','this','super','self','True','False','None']);
const TYPE_SET=new Set(['any','string','number','boolean','unknown','never','object','symbol','bigint','int','float','str','bool','dict','list','tuple','set','Promise','Record','Array','Map','Set','Error','Request','Response','NextFunction']);

function span(cls,txt){return `<span class="syn-${cls}">${esc(txt)}</span>`}
function scanQuoted(src,i,q){
  let j=i+1;
  while(j<src.length){
    if(src[j]==='\\'){j+=2;continue}
    if(src[j]===q){j++;break}
    j++;
  }
  return j;
}
function highlightCode(src,lang='js'){
  if(!src)return '';
  const isPy=lang==='py'||lang==='sh'||lang==='rb'||lang==='yaml';
  const isSql=lang==='sql';
  const kw=isPy?KW_PY:isSql?KW_SQL:KW_COMMON;
  let out='',i=0,n=src.length;
  while(i<n){
    const ch=src[i],next=src[i+1];
    // Comments
    if(!isPy&&ch==='/'&&next==='/'){out+=span('cm',src.slice(i));break}
    if(!isPy&&ch==='/'&&next==='*'){
      const end=src.indexOf('*/',i+2);
      const j=end<0?n:end+2;
      out+=span('cm',src.slice(i,j));i=j;continue;
    }
    if(isPy&&ch==='#'){out+=span('cm',src.slice(i));break}
    if(isSql&&ch==='-'&&next==='-'){out+=span('cm',src.slice(i));break}
    // JS/TS template literal with ${...} interpolation
    if((lang==='js'||lang==='ts')&&ch==='`'){
      let j=i+1,segStart=i;
      while(j<n){
        if(src[j]==='\\'){j+=2;continue}
        if(src[j]==='$'&&src[j+1]==='{'){
          if(j>segStart)out+=span('str',src.slice(segStart,j));
          out+=span('var','${');
          let k=j+2,depth=1;
          while(k<n&&depth>0){
            if(src[k]==='"'||src[k]==="'"||src[k]==='`'){k=scanQuoted(src,k,src[k]);continue}
            if(src[k]==='{')depth++;
            else if(src[k]==='}')depth--;
            if(depth>0)k++;
          }
          out+=highlightCode(src.slice(j+2,k),lang);
          if(k<n&&src[k]==='}'){out+=span('var','}');k++}
          j=k;segStart=k;continue;
        }
        if(src[j]==='`'){j++;break}
        j++;
      }
      if(j>segStart)out+=span('str',src.slice(segStart,j));
      i=j;continue;
    }
    // Single / double quoted strings
    if(ch==='"'||ch==="'"){
      const j=scanQuoted(src,i,ch);
      out+=span('str',src.slice(i,j));i=j;continue;
    }
    // Numbers
    if((ch>='0'&&ch<='9')||(ch==='.'&&next>='0'&&next<='9')){
      const m=src.slice(i).match(/^(?:0[xXbBoO][\da-fA-F_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?)/);
      if(m){out+=span('num',m[0]);i+=m[0].length;continue}
    }
    // Identifiers / keywords / types / functions
    if(/[A-Za-z_$]/.test(ch)){
      let j=i+1;
      while(j<n&&/[A-Za-z0-9_$]/.test(src[j]))j++;
      const word=src.slice(i,j);
      const key=isSql?word.toLowerCase():word;
      if(kw.has(key)){out+=span('kw',word)}
      else if(LIT_SET.has(word)){out+=span('num',word)}
      else if(TYPE_SET.has(word)||(/^[A-Z][A-Za-z0-9_]+$/.test(word)&&src.slice(j).search(/^\s*\(/)!==0)){out+=span('type',word)}
      else if(/^\s*\(/.test(src.slice(j))){out+=span('fn',word)}
      else{out+=esc(word)}
      i=j;continue;
    }
    // Punctuation / operators
    if(/[{}()[\]:;,.=<>!&|?+\-*/%^~]/.test(ch)){
      const m=src.slice(i).match(/^(?:===|!==|=>|\?\?|&&|\|\||<=|>=|[{}()[\]:;,.=<>!&|?+\-*/%^~])/);
      out+=span('op',m[0]);i+=m[0].length;continue;
    }
    out+=esc(ch);i++;
  }
  return out;
}

function highlightDiff(diffText,file){
  const [lang]=langFromFile(file);
  const lines=String(diffText||'').split('\n');
  const hasHunks=lines.some(l=>/^@@\s+-\d+/.test(l));
  let oldLn=0,newLn=0;
  const gutter=(a,b)=>hasHunks?`<span class="dln">${a}</span><span class="dln dln-n">${b}</span>`:'';
  return lines.map(raw=>{
    const hm=raw.match(/^(@@\s+-(\d+)(?:,\d+)?\s+\+(\d+)(?:,\d+)?\s+@@)(.*)$/);
    if(hm){
      oldLn=Number(hm[2]);newLn=Number(hm[3]);
      const ctx=hm[4]?`<span class="hunk-ctx">${highlightCode(hm[4].trimStart(),lang)}</span>`:'';
      return `<span class="dl hunk">${gutter('…','…')}<span class="dsign"></span><span class="dcode">${esc(hm[1])}${ctx}</span></span>`;
    }
    if(raw.startsWith('--- ')||raw.startsWith('+++ ')||raw.startsWith('diff --git ')||raw.startsWith('index ')){
      return `<span class="dl meta">${gutter('','')}<span class="dsign"></span><span class="dcode">${esc(raw)}</span></span>`;
    }
    if(raw.startsWith('+')){
      const num=hasHunks?newLn++:'';
      return `<span class="dl add">${gutter('',num)}<span class="dsign">+</span><span class="dcode">${highlightCode(raw.slice(1),lang)}</span></span>`;
    }
    if(raw.startsWith('-')){
      const num=hasHunks?oldLn++:'';
      return `<span class="dl del">${gutter(num,'')}<span class="dsign">-</span><span class="dcode">${highlightCode(raw.slice(1),lang)}</span></span>`;
    }
    const code=raw.startsWith(' ')?raw.slice(1):raw;
    const o=hasHunks&&oldLn?oldLn++:'';
    const nw=hasHunks&&newLn?newLn++:'';
    return `<span class="dl">${gutter(o,nw)}<span class="dsign"> </span><span class="dcode">${highlightCode(code,lang)}</span></span>`;
  }).join('');
}

function highlightJsonWithMarks(src){
  let out='',i=0,n=src.length;
  while(i<n){
    const ch=src[i];
    if(ch==='"'){
      const j=scanQuoted(src,i,'"');
      const token=src.slice(i,j);
      const isKey=/^\s*:/.test(src.slice(j));
      if(isKey)out+=span('type',token);
      else out+=`<span class="syn-str">${hl(token)}</span>`;
      i=j;continue;
    }
    if(ch==='-'||(ch>='0'&&ch<='9')){
      const m=src.slice(i).match(/^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/);
      if(m){out+=span('num',m[0]);i+=m[0].length;continue}
    }
    const km=src.slice(i).match(/^(?:true|false|null)\b/);
    if(km){out+=span('kw',km[0]);i+=km[0].length;continue}
    if(/[{}[\]:,]/.test(ch)){out+=span('op',ch);i++;continue}
    out+=esc(ch);i++;
  }
  return out;
}

function highlightHttpLine(method,decodedPath){
  const m=String(method||'').toUpperCase();
  const mTag=m?`<span class="http-m m-${esc(m.toLowerCase())}">${esc(m)}</span>`:'';
  const p=String(decodedPath||'');
  const qi=p.indexOf('?');
  if(qi<0)return mTag+hl(p);
  const base=p.slice(0,qi),qs=p.slice(qi+1);
  const parts=qs.split('&').map(pair=>{
    const eq=pair.indexOf('=');
    if(eq<0)return hl(pair);
    return span('type',pair.slice(0,eq))+span('op','=')+hl(pair.slice(eq+1));
  }).join(span('op','&'));
  return mTag+hl(base)+span('op','?')+parts;
}

function highlightBody(rawBody){
  const text=String(rawBody??'');
  const trimmed=text.trim();
  if(trimmed.startsWith('{')||trimmed.startsWith('[')){
    try{return highlightJsonWithMarks(JSON.stringify(JSON.parse(trimmed),null,2))}catch(e){}
  }
  if(/^[^=\s&]+=/.test(trimmed)&&!trimmed.includes('\n')){
    return trimmed.split('&').map(pair=>{
      const eq=pair.indexOf('=');
      if(eq<0)return hl(decode(pair));
      return span('type',decode(pair.slice(0,eq)))+span('op','=')+hl(decode(pair.slice(eq+1)));
    }).join(span('op','&'));
  }
  return hl(decode(text));
}

function highlightRaw(method,path,body){
  const m=String(method||'').toUpperCase();
  const mTag=m?`<span class="http-m m-${esc(m.toLowerCase())}">${esc(m)}</span>`:'';
  let out=mTag+esc(path||'');
  if(body){
    const b=String(body);
    const t=b.trim();
    const isJson=(t.startsWith('{')||t.startsWith('['))&&(()=>{try{JSON.parse(t);return true}catch(e){return false}})();
    out+='\n\n'+(isJson?highlightJsonWithMarks(b):esc(b));
  }
  return out;
}
function extractChangedCode(diffText){
  const lines=String(diffText||'').split('\n');
  const blocks=[];
  let cur=[];
  for(const raw of lines){
    if(raw.startsWith('+++ ')||raw.startsWith('--- ')||raw.startsWith('@@ ')||raw.startsWith('diff --git ')||raw.startsWith('index ')){
      if(cur.length){blocks.push(cur);cur=[]}
      continue;
    }
    if(raw.startsWith('+')){
      cur.push(raw.slice(1));
    }else if(cur.length){
      blocks.push(cur);cur=[];
    }
  }
  if(cur.length)blocks.push(cur);
  if(!blocks.length){
    const fallback=lines
      .filter(l=>!l.startsWith('--- ')&&!l.startsWith('+++ ')&&!l.startsWith('@@ ')&&!l.startsWith('diff --git ')&&!l.startsWith('index ')&&!l.startsWith('-'))
      .map(l=>l.startsWith(' ')?l.slice(1):l);
    return fallback.length?fallback.join('\n'):String(diffText||'');
  }
  return blocks.map(block=>{
    const nonEmpty=block.filter(l=>l.trim().length>0);
    const minIndent=nonEmpty.length?Math.min(...nonEmpty.map(l=>l.match(/^[ \t]*/)[0].length)):0;
    return block.map(l=>l.slice(minIndent)).join('\n');
  }).join('\n\n');
}

const variantCell=v=>v==='PROVEN'?'<span class="pill oc-blocked">Works</span>':v==='ERROR'?'<span class="pill fx-fail">Error</span>':v==='NOT_RUN'?'<span class="mute">Not run</span>':'<span class="pill fx-done">Blocked</span>';

const copyStore=new Map();
function copyBtn(id,text,label='Copy'){
  copyStore.set(id,text);
  return `<button type="button" class="btn subtle copy-btn" data-copy-id="${esc(id)}"><span class="copy-inner">${ICONS.copy}<span>${esc(label)}</span></span></button>`;
}

function drawerHead(section,ref,actions){
  return `<div class="dh"><span class="crumb"><button type="button" class="crumb-a" data-close>${esc(section)}</button>${L.chevR}<span class="crumb-id">${esc(ref)}</span></span><span class="grow"></span>${actions}
    <button type="button" class="ib" data-copy-link aria-label="Copy link" title="Copy link">${L.link}</button>
    <button type="button" class="ib" data-close aria-label="Close details" title="Close · Esc">${L.close}</button></div>`;
}

function signalDrawer(s){
  copyStore.clear();
  const blocked=blockFor(s.raw_ip);
  const f=s.fix;
  const pr=f&&f.pr_url;
  const ref=sigRef(s);
  let cta='';
  if(pr)cta=`<a class="btn primary" href="${esc(pr)}" target="_blank" rel="noopener" data-stop>Review ${esc(prNum(pr)||'PR')}</a>`;
  else if(f&&f.diff)cta=`<button type="button" class="btn" data-scroll="dPatch">View patch</button>`;
  const enforce=blocked?`<span class="chip">${blocked.kind==='block'?L.block:L.slow}${blocked.kind==='block'?'Blocked':'Slowed'} · ${esc(fmtLeft(leftNow(blocked)).replace(/ left$/,''))}</span><button type="button" class="btn subtle" data-unblock="${esc(s.raw_ip)}" data-label="${esc(s.ip)}">Unblock</button>`:'';
  const fixVal=s.fix_label?`${fixChip(s)}${f&&f.file?`<span class="pv-sub mono">${esc(f.file)}</span>`:''}`:'<span class="pv-sub">None</span>';
  const dry=f&&f.status==='ready'&&S.fix_mode!=='pr'?`<div class="note">Bouncer is in dry-run mode, so it tested the patch but did not open a pull request. Deploy with <span class="mono">FIX_MODE=pr</span> to have it open one.</div>`:'';
  const decoded=`${s.method||''} ${decodePath(s.path)}`.trim();
  const raw=`${s.method||''} ${s.path}${s.body?'\n\n'+s.body:''}`.trim();
  const bodyIsJson=s.body&&(()=>{const t=String(s.body).trim();if(!t.startsWith('{')&&!t.startsWith('['))return false;try{JSON.parse(t);return true}catch(e){return false}})();
  let fixHtml='';
  if(f){
    const [,langLabel]=langFromFile(f.file);
    fixHtml=`${f.summary?`<section class="ds"><h4>What the patch changes</h4><p class="prose">${esc(f.summary)}</p></section>`:''}
      ${f.diff?`<section class="ds" id="dPatch"><div class="ds-h"><h4>Patch${f.file?` · <span class="mono">${esc(f.file)}</span>`:''}${langLabel?`<span class="lang-tag">${esc(langLabel)}</span>`:''}</h4>${copyBtn('sig-diff',extractChangedCode(f.diff),'Copy changes')}</div><pre class="diff" data-no-drag>${highlightDiff(f.diff,f.file)}</pre></section>`:''}
      ${(f.variants||[]).length?`<section class="ds"><h4>Other ways in, tried before and after the patch</h4><div class="vt-wrap" data-no-drag><table class="vt"><thead><tr><th>Variant</th><th>Before</th><th>After</th></tr></thead><tbody>${f.variants.map(v=>`<tr><td>${esc(v.idea)}</td><td class="nowrap">${v.before==='PROVEN'?'<span class="pill oc-blocked">Works</span>':'<span class="mute">Not shown</span>'}</td><td class="nowrap">${variantCell(v.after)}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;
  }
  return drawerHead('Signals',ref,cta)+`<div class="db">
    <h1 class="dtitle" id="dTitle">${esc(s.title)}</h1>
    ${s.summary?`<p class="lede">${esc(s.summary)}</p>`:''}
    <dl class="props">
      <dt>Status</dt><dd><button type="button" class="pick" id="statusPick" data-status-menu aria-haspopup="menu" aria-expanded="false" aria-keyshortcuts="S">${statusIcon(s.status)}${esc(STATUS_LABEL[s.status]||s.status)}${L.caret}</button></dd>
      <dt>Severity</dt><dd><span class="pv">${sevIcon(s.severity)}${esc(SEV_LABEL[s.severity]||s.severity)}</span></dd>
      <dt>Source</dt><dd><span class="pv mono">${esc(s.ip)}</span>${enforce}</dd>
      <dt>Fix</dt><dd>${fixVal}</dd>
      ${s.jev?`<dt>Classifier</dt><dd><span class="pv">${pct(s.jev.malicious)} attack</span><span class="pv-sub">· suggested ${esc(s.jev.action||'–')} · ${pct(s.jev.confidence)} confident</span></dd>`:''}
      <dt>Seen</dt><dd><span class="pv">${fmtN(s.count)} ${plural(s.count,'time','times')}</span><span class="pv-sub" title="${esc(stamp(s.first))} – ${esc(stamp(s.last))}">· last ${esc(ago(s.last))}</span></dd>
    </dl>
    ${dry}
    ${f&&f.line?`<div class="note">${esc(f.line)}</div>`:''}
    <section class="ds"><h4>Activity</h4>${activityHtml(s.steps||[])}</section>
    <section class="ds"><div class="ds-h"><h4>Request</h4>${copyBtn('sig-req',decoded)}</div><div class="req">${highlightHttpLine(s.method,decodePath(s.path))}</div></section>
    ${s.body?`<section class="ds"><div class="ds-h"><h4>Body${bodyIsJson?'<span class="lang-tag">JSON</span>':''}</h4>${copyBtn('sig-body',bodyIsJson?s.body:decode(s.body))}</div><div class="req">${highlightBody(s.body)}</div></section>`:''}
    ${fixHtml}
    <section class="ds"><div class="ds-h"><h4>Raw, as received</h4>${copyBtn('sig-raw',raw)}</div><div class="req">${highlightRaw(s.method,s.path,s.body)}</div></section>
  </div>`;
}

function eventDrawer(r){
  copyStore.clear();
  const [oc,ol]=outcomeOf(r);
  const sig=(S.signals||[]).find(s=>(s.rids||[]).includes(r.rid));
  const lines=(r.steps||[]).map(e=>e.line).filter(Boolean);
  const decoded=`${r.method||''} ${decodePath(r.path)}`.trim();
  const raw=`${r.method||''} ${r.path}`.trim();
  return drawerHead('Requests',clock24(r.first),'')+`<div class="db">
    <h1 class="dtitle mono" id="dTitle">${esc(r.method||'')} ${esc(bare(decodePath(r.path)))}</h1>
    ${sig?`<button type="button" class="link-card" data-open="${esc(sig.id)}">${statusMark(sig.status)}<span class="link-card-k">Related signal · ${esc(sigRef(sig))}</span><span class="link-card-v">${esc(sig.title)}</span><span class="car">${L.chevR}</span></button>`:''}
    <dl class="props">
      <dt>Outcome</dt><dd><span class="pv"><i class="odot o-${oc}" aria-hidden="true"></i>${esc(ol)}</span></dd>
      <dt>Severity</dt><dd><span class="pv">${sevIcon(r.severity||'info')}${esc(SEV_LABEL[r.severity||'info'])}</span></dd>
      <dt>Source</dt><dd><span class="pv mono">${esc(r.ip)}</span></dd>
      <dt>Time</dt><dd><span class="pv">${esc(stamp(r.first))}</span></dd>
      <dt>Classifier</dt><dd>${r.malicious!=null?`<span class="pv">${pct(r.malicious)} attack</span><span class="pv-sub">· suggested ${esc(r.jev_action||'–')} · ${pct(r.confidence)} confident</span>`:'<span class="pv-sub">Not scored</span>'}</dd>
      ${r.verdict?`<dt>Replay</dt><dd><span class="pv">${esc(r.verdict.replace(/_/g,' ').toLowerCase())}</span>${r.why?`<span class="pv-sub">· ${esc(r.why)}</span>`:''}</dd>`:''}
    </dl>
    ${lines.length?`<section class="ds"><h4>Bouncer's notes</h4>${lines.map(l=>`<p class="prose">${esc(l)}</p>`).join('')}</section>`:''}
    <section class="ds"><div class="ds-h"><h4>Request</h4>${copyBtn('evt-req',decoded)}</div><div class="req">${highlightHttpLine(r.method,decodePath(r.path))}</div></section>
    <section class="ds"><div class="ds-h"><h4>Raw, as received</h4>${copyBtn('evt-raw',raw)}</div><div class="req">${highlightRaw(r.method,r.path,'')}</div></section>
  </div>`;
}

let lastFocus=null,closing=null,lastDrawerHtml='';
function setInstant(on){[$('drawer'),$('scrim')].forEach(el=>el.classList.toggle('instant',on))}
function syncDockMode(){
  const d=$('drawer');
  if(DOCK.matches){d.setAttribute('role','complementary');d.removeAttribute('aria-modal')}
  else{d.setAttribute('role','dialog');d.setAttribute('aria-modal','true')}
}
function finishHide(){
  const d=$('drawer'),sc=$('scrim');
  clearTimeout(closing);closing=null;
  d.hidden=true;sc.hidden=true;
  d.dataset.state='';sc.dataset.state='';
  d.style.transform='';sc.style.opacity='';
  d.classList.remove('dragging');sc.classList.remove('dragging');
  d.innerHTML='';lastDrawerHtml='';
}
function hideDrawer(){
  const d=$('drawer'),sc=$('scrim');
  closeMenu(false);
  document.body.classList.remove('drawer-open');
  if(d.hidden||d.dataset.state==='closed')return;
  if(ui.instant){setInstant(true);return finishHide()}
  setInstant(false);
  d.style.transform='';sc.style.opacity='';
  d.dataset.state='closed';sc.dataset.state='closed';
  clearTimeout(closing);
  const dur=reduceMotion()?170:220;
  const onEnd=ev=>{if(ev.target!==d)return;d.removeEventListener('transitionend',onEnd);finishHide()};
  d.addEventListener('transitionend',onEnd);
  closing=setTimeout(()=>{d.removeEventListener('transitionend',onEnd);finishHide()},dur+40);
}
function renderDrawer(){
  const d=$('drawer'),sc=$('scrim'),o=ui.open;
  let html='';
  if(o&&o.id){const s=findSignal(o.id);if(s)html=signalDrawer(s)}
  if(o&&o.evt){const r=requests().find(x=>evtKey(x)===o.evt);if(r)html=eventDrawer(r)}
  if(!html)return hideDrawer();
  const appearing=d.hidden||d.dataset.state==='closed';
  clearTimeout(closing);closing=null;
  syncDockMode();
  document.body.classList.add('drawer-open');
  if(!appearing&&html===lastDrawerHtml&&!ui.scrollTo)return;
  const menuOpen=!$('menu').hidden;
  const prevSignal=d.dataset.key;
  const nextKey=o.id?'s:'+o.id:'e:'+o.evt;
  const scroll=prevSignal===nextKey?(d.querySelector('.db')?.scrollTop||0):0;
  setInstant(appearing&&ui.instant);
  d.style.transform='';sc.style.opacity='';
  if(html!==lastDrawerHtml){d.innerHTML=html;lastDrawerHtml=html}
  d.dataset.key=nextKey;
  d.hidden=false;sc.hidden=false;
  d.dataset.state='open';sc.dataset.state='open';
  const db=d.querySelector('.db');
  if(db)db.scrollTop=scroll;
  if(ui.scrollTo){
    const el=$(ui.scrollTo);
    ui.scrollTo=null;
    if(el&&db)db.scrollTop=Math.max(0,el.offsetTop-db.offsetTop-12);
  }
  if(menuOpen){
    const pick=$('statusPick');
    if(pick&&prevSignal===nextKey){pick.setAttribute('aria-expanded','true');placeMenu(pick)}
    else closeMenu(false);
  }
  if(appearing&&!DOCK.matches){
    const closeBtn=d.querySelector('.ib[data-close]');
    if(closeBtn)closeBtn.focus({preventScroll:true});
  }
}
function openDrawer(o,tab){
  if(!ui.open||$('drawer').hidden)lastFocus=document.activeElement;
  ui.open=o;
  ui.scrollTo=tab==='fix'?'dPatch':null;
  setHash();renderAll();
}
function closeDrawer(){
  ui.open=null;setHash();renderAll();

function placeMenu(anchor){
  const m=$('menu');
  const r=anchor.getBoundingClientRect();
  const w=m.offsetWidth||200,h=m.offsetHeight||120;
  const left=Math.min(Math.max(8,r.left),window.innerWidth-w-8);
  const below=r.bottom+4+h<window.innerHeight-8;
  m.style.left=left+'px';
  m.style.top=(below?r.bottom+4:Math.max(8,r.top-h-4))+'px';
}
function openStatusMenu(){
  const s=ui.open&&ui.open.id&&findSignal(ui.open.id);
  const pick=$('statusPick');
  if(!s||!pick)return;
  const m=$('menu');
  m.innerHTML=STATUS_ORDER.map((k,i)=>`<button type="button" class="mi" role="menuitemradio" aria-checked="${s.status===k}" data-set-status="${k}">${statusIcon(k)}<span>${STATUS_LABEL[k]}</span>${s.status===k?L.check:''}<kbd>${i+1}</kbd></button>`).join('');
  m.hidden=false;
  pick.setAttribute('aria-expanded','true');
  placeMenu(pick);
  (m.querySelector('[aria-checked="true"]')||m.querySelector('.mi')).focus({preventScroll:true});
}
function closeMenu(restore){
  const m=$('menu');
  if(m.hidden)return;
  const hadFocus=m.contains(document.activeElement);
  m.hidden=true;m.innerHTML='';
  const pick=$('statusPick');
  if(pick){pick.setAttribute('aria-expanded','false');if(restore||hadFocus)pick.focus({preventScroll:true})}
}
function pickStatus(k){
  const id=ui.open&&ui.open.id;
  closeMenu(true);
  const s=id&&findSignal(id);
  if(!s||s.status===k)return;
  setSignalStatus(id,k,true);
}

/* Drawer 1:1 swipe-right-to-dismiss gesture (rubber-band left, velocity dismissal, linked scrim) */
(function initDrawerDrag(){
  const d=$('drawer'),sc=$('scrim');
  let drag=null;
  const rubberband=(over,dim,c=0.22)=>(over*dim*c)/(dim+c*Math.abs(over));
  d.addEventListener('pointerdown',ev=>{
    if(ev.button&&ev.button!==0)return;
    if(ev.pointerType==='mouse'&&ev.target.closest('pre,code,.req,table,button,a'))return;
    if(ev.target.closest('[data-no-drag]'))return;
    if(drag)return; // multi-touch guard
    drag={id:ev.pointerId,x0:ev.clientX,y0:ev.clientY,dx:0,active:false,samples:[[ev.clientX,performance.now()]],w:d.offsetWidth||400};
  });
  d.addEventListener('pointermove',ev=>{
    if(!drag||ev.pointerId!==drag.id)return;
    const dx=ev.clientX-drag.x0,dy=ev.clientY-drag.y0;
    if(!drag.active){
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){drag=null;return}
      if(Math.abs(dx)<10)return;
      if(dx<0&&ev.pointerType==='mouse'){drag=null;return}
      drag.active=true;
      d.classList.add('dragging');sc.classList.add('dragging');
      try{d.setPointerCapture(ev.pointerId)}catch(e){}
    }
    const tx=dx>=0?dx:rubberband(dx,drag.w);
    drag.dx=dx;
    drag.samples.push([ev.clientX,performance.now()]);
    if(drag.samples.length>5)drag.samples.shift();
    d.style.transform=`translateX(${tx.toFixed(1)}px)`;
    const prog=Math.max(0,Math.min(1,1-Math.max(0,dx)/drag.w));
    sc.style.opacity=String(prog.toFixed(3));
  });
  const endDrag=ev=>{
    if(!drag||ev.pointerId!==drag.id)return;
    const wasActive=drag.active;
    const {dx,w,samples}=drag;
    drag=null;
    if(!wasActive)return;
    d.classList.remove('dragging');sc.classList.remove('dragging');
    const first=samples[0],last=samples[samples.length-1];
    const dt=Math.max(1,last[1]-first[1]);
    const vel=(last[0]-first[0])/dt; // px/ms
    if(dx>=w*0.35||vel>0.11){
      ui.instant=false;
      closeDrawer();
    }else{
      d.style.transform='';
      sc.style.opacity='';
    }
  };
  d.addEventListener('pointerup',endDrag);
  d.addEventListener('pointercancel',endDrag);
})();

async function copyText(btn,text){
  let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);ok=true}}catch(e){}
  if(!ok){
    try{
      const ta=document.createElement('textarea');
      ta.value=text;ta.style.cssText='position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove();
    }catch(e){}
  }
  if(!ok){toast("Couldn't copy to clipboard.",{error:true});return}
  const orig=btn.dataset.orig||btn.querySelector('.copy-inner').innerHTML;
  btn.dataset.orig=orig;
  clearTimeout(btn._t1);clearTimeout(btn._t2);
  btn.classList.add('swapping');
  btn._t1=setTimeout(()=>{
    btn.classList.add('copied');
    btn.querySelector('.copy-inner').innerHTML=`${ICONS.checkBtn}<span>Copied</span>`;
    btn.classList.remove('swapping');
  },reduceMotion()?0:90);
  btn._t2=setTimeout(()=>{
    if(!document.contains(btn))return;
    btn.classList.add('swapping');
    setTimeout(()=>{
      if(!document.contains(btn))return;
      btn.classList.remove('copied');
      btn.querySelector('.copy-inner').innerHTML=orig;
      btn.classList.remove('swapping');
    },reduceMotion()?0:90);
  },1800);
}

const activeToasts=new Set();
let lastUndo=null;
function toast(message,opts={}){
  const host=$('toasts');
  const el=document.createElement('div');
  el.className='toast'+(opts.error?' err':'');
  el.setAttribute('role',opts.error?'alert':'status');
  const ic=opts.error?svg16('<circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="10.75" r=".9" fill="currentColor"/>','toast-ic'):svg16('<circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="m5.6 8.1 1.6 1.6 3.2-3.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>','toast-ic');
  el.innerHTML=`${ic}<span class="toast-msg">${esc(message)}</span>`+
    (opts.action?`<button type="button" class="btn subtle">${esc(opts.action.label)}</button>${opts.action.kbd?`<kbd>${esc(opts.action.kbd)}</kbd>`:''}`:'');
  host.appendChild(el);
  const state={el,remaining:opts.duration||(opts.action?6000:4200),started:0,timer:null,paused:false,done:false};
  const dismiss=()=>{
    if(state.done)return;
    state.done=true;
    clearTimeout(state.timer);
    activeToasts.delete(state);
    if(state.undo&&lastUndo===state.undo)lastUndo=null;
    el.dataset.state='leaving';
    const rm=()=>el.remove();
    el.addEventListener('transitionend',rm,{once:true});
    setTimeout(rm,450);
  };
  const start=()=>{
    if(state.done||state.paused||document.hidden)return;
    state.started=Date.now();
    clearTimeout(state.timer);
    state.timer=setTimeout(dismiss,state.remaining);
  };
  const pause=()=>{
    if(state.done||state.paused)return;
    state.paused=true;
    clearTimeout(state.timer);
    if(state.started)state.remaining=Math.max(400,state.remaining-(Date.now()-state.started));
  };
  const resume=()=>{state.paused=false;start()};
  el.addEventListener('pointerenter',pause);
  el.addEventListener('pointerleave',resume);
  if(opts.action){
    const run=()=>{dismiss();opts.action.onClick()};
    el.querySelector('button').addEventListener('click',run);
    if(opts.action.undo){state.undo=run;lastUndo=run}
  }
  state.pause=pause;state.resume=resume;
  activeToasts.add(state);
  start();
  return dismiss;
}
document.addEventListener('visibilitychange',()=>{
  activeToasts.forEach(t=>document.hidden?t.pause():t.resume());
});

function renderAll(){renderNav();renderBlocked();renderSignals();renderTraffic(true);renderProbes();renderDrawer()}

async function api(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){location.reload();return null}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r;
}
let retry=null;
function showBanner(text){
  const b=$('banner');b.hidden=!text;
  b.innerHTML=text?`${svg16('<circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="10.75" r=".9" fill="currentColor"/>')}<span>${esc(text)}</span>`:'';
}
async function sync(){
  clearTimeout(retry);
  try{
    const r=await fetch('api/state');
    if(r.status===401)return location.reload();
    if(!r.ok)throw new Error('HTTP '+r.status);
    const next=await r.json();
    if(ui.loaded){const known=new Set((S.signals||[]).map(x=>x.id));(next.signals||[]).forEach(x=>{if(!known.has(x.id))arrived.set('s:'+x.id,Date.now())})}
    S=next;ui.loaded=true;ui.lastSync=Date.now();
    numberSignals();showBanner('');renderAll();updateLive();scrollSpy();
  }catch(e){
    showBanner("Couldn't load the latest data from Bouncer. Retrying in 5 seconds.");
    retry=setTimeout(sync,5000);
  }
}
let syncTimer=null;const soon=()=>{clearTimeout(syncTimer);syncTimer=setTimeout(sync,400)};

async function setSignalStatus(id,nextStatus,showUndo){
  const s=findSignal(id);
  const prevStatus=s?s.status:null;
  if(s)s.status=nextStatus;
  renderAll();
  try{
    await api('api/signal',{id,status:nextStatus});
    sync();
    if(showUndo&&prevStatus&&prevStatus!==nextStatus){
      const ref=s?sigRef(s):'Signal';
      toast(`${ref} moved to ${STATUS_LABEL[nextStatus]||nextStatus}`,{action:{label:'Undo',kbd:`${MOD}Z`,undo:true,onClick:()=>setSignalStatus(id,prevStatus,false)}});
    }
  }catch(e){
    if(s&&prevStatus)s.status=prevStatus;
    renderAll();
    toast("Couldn't update the signal status. Try again.",{error:true});
  }
}

async function unblock(ip,label,btn){
  const orig=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Unblocking…'}
  try{
    await api('api/unblock',{ip});
    toast(`Unblocked ${label}`);
    return sync();
  }catch(e){
    if(btn&&document.contains(btn)){btn.disabled=false;btn.textContent=orig}
    toast(`Couldn't unblock ${label}. Try again.`,{error:true});
  }
}

async function copyLink(){
  try{await navigator.clipboard.writeText(location.href);toast('Link copied')}
  catch(e){toast("Couldn't copy the link.",{error:true})}
}

const SECTIONS=[['signals','signalsPanel','Signals'],['blocked','blockedPanel','Blocked'],['traffic','trafficPanel','Traffic'],['requests','requestsPanel','Requests'],['probes','probesPanel','Probed paths']];
function jumpTo(key){
  const sec=SECTIONS.find(x=>x[0]===key);
  if(!sec)return;
  const el=$(sec[1]);
  el.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'});
  setActiveNav(key);
}
function setActiveNav(key){
  document.querySelectorAll('.nav[data-jump]').forEach(n=>{
    if(n.dataset.jump===key)n.setAttribute('aria-current','true');else n.removeAttribute('aria-current');
  });
}
let spyRaf=0;
function scrollSpy(){
  spyRaf=0;
  const top=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top'))||0;
  let cur=SECTIONS[0][0];
  for(const [key,id] of SECTIONS){
    const el=$(id);
    if(el&&el.getBoundingClientRect().top<=top+80)cur=key;
  }
  if(window.scrollY>0&&window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur=SECTIONS[SECTIONS.length-1][0];
  setActiveNav(cur);
}
window.addEventListener('scroll',()=>{if(!spyRaf)spyRaf=requestAnimationFrame(scrollSpy)},{passive:true});

const K={items:[],shown:[],idx:0,focus:null};
function paletteItems(){
  const items=[];
  const s=ui.open&&ui.open.id&&findSignal(ui.open.id);
  if(s){
    const grp=`${sigRef(s)} · ${s.title}`;
    STATUS_ORDER.forEach((k,i)=>{if(s.status!==k)items.push({group:'This signal',label:`Change status to ${STATUS_LABEL[k]}`,icon:statusIcon(k),hint:['S',String(i+1)],run:()=>setSignalStatus(s.id,k,true)})});
    if(s.fix&&s.fix.pr_url)items.push({group:'This signal',label:`Review ${prNum(s.fix.pr_url)||'pull request'} on GitHub`,icon:L.pr,run:()=>window.open(s.fix.pr_url,'_blank','noopener')});
    if(s.fix&&s.fix.diff)items.push({group:'This signal',label:'View patch',icon:L.go,run:()=>{ui.scrollTo='dPatch';renderDrawer()}});
    if(blockFor(s.raw_ip))items.push({group:'This signal',label:`Unblock ${s.ip}`,icon:L.block,run:()=>unblock(s.raw_ip,s.ip)});
    items.push({group:'This signal',label:'Copy link to signal',icon:L.link,run:copyLink});
    K.ctx=grp;
  }else K.ctx='';
  SECTIONS.forEach(([key,,label])=>items.push({group:'Go to',label:`Go to ${label}`,icon:L.go,run:()=>jumpTo(key)}));
  items.push({group:'Go to',label:ui.sideHidden?'Expand sidebar':'Collapse sidebar',icon:L.go,hint:[MOD,'B'],run:toggleSide});
  items.push({group:'Go to',label:ui.live?'Pause live updates':'Resume live updates',icon:ui.live?L.pause:L.play,run:toggleLive});
  (S.signals||[]).forEach(x=>items.push({group:'Signals',label:`${sigRef(x)}  ${x.title}`,icon:statusIcon(x.status),hint:[shortAgo(x.last)],plain:true,run:()=>openDrawer({id:x.id})}));
  (S.lists||[]).forEach(x=>items.push({group:'Blocked',label:`Unblock ${x.label}`,icon:x.kind==='block'?L.block:L.slow,run:()=>unblock(x.ip,x.label)}));
  return items;
}
function renderPalette(){
  const q=$('kq').value.trim().toLowerCase();
  const words=q.split(/\s+/).filter(Boolean);
  K.shown=K.items.filter(it=>words.every(w=>it.label.toLowerCase().includes(w)||it.group.toLowerCase().includes(w)));
  if(!q)K.shown=K.shown.filter(it=>it.group!=='Blocked');
  K.idx=Math.min(K.idx,Math.max(0,K.shown.length-1));
  const ctx=$('kctx');ctx.hidden=!K.ctx;ctx.textContent=K.ctx||'';
  if(!K.shown.length){$('klist').innerHTML='<div class="kempty">No matching commands</div>';$('kq').removeAttribute('aria-activedescendant');return}
  let last='';
  $('klist').innerHTML=K.shown.map((it,i)=>{
    const head=it.group!==last?`<div class="kg" role="presentation">${esc(it.group)}</div>`:'';
    last=it.group;
    const hint=(it.hint||[]).filter(Boolean).map(h=>it.plain?esc(h):`<kbd>${esc(h)}</kbd>`).join('');
    return `${head}<button type="button" class="kit" id="kit-${i}" role="option" aria-selected="${i===K.idx}" data-k-idx="${i}">${it.icon||''}<span class="kit-l">${esc(it.label)}</span>${hint?`<span class="kit-h">${hint}</span>`:''}</button>`;
  }).join('');
  $('kq').setAttribute('aria-activedescendant','kit-'+K.idx);
  const sel=$('kit-'+K.idx);if(sel)sel.scrollIntoView({block:'nearest'});
}
function moveIdx(d){
  if(!K.shown.length)return;
  K.idx=(K.idx+d+K.shown.length)%K.shown.length;
  $('klist').querySelectorAll('.kit').forEach((el,i)=>el.setAttribute('aria-selected',String(i===K.idx)));
  $('kq').setAttribute('aria-activedescendant','kit-'+K.idx);
  const sel=$('kit-'+K.idx);if(sel)sel.scrollIntoView({block:'nearest'});
}
const paletteOpen=()=>!$('kmenu').hidden;
function openPalette(){
  closeMenu(false);
  K.focus=document.activeElement;
  K.items=paletteItems();K.idx=0;
  $('kq').value='';
  $('kmenu').hidden=false;
  renderPalette();
  $('kq').focus();
}
function closePalette(restore){
  if(!paletteOpen())return;
  $('kmenu').hidden=true;
  if(restore&&K.focus&&document.contains(K.focus))K.focus.focus({preventScroll:true});
}
function runPalette(i){
  const it=K.shown[i];
  closePalette(true);
  if(it)it.run();
}
$('kq').addEventListener('input',()=>{K.idx=0;renderPalette()});
$('kq').addEventListener('keydown',ev=>{
  if(ev.key==='ArrowDown'||(ev.ctrlKey&&ev.key==='n')){ev.preventDefault();moveIdx(1)}
  else if(ev.key==='ArrowUp'||(ev.ctrlKey&&ev.key==='p')){ev.preventDefault();moveIdx(-1)}
  else if(ev.key==='Enter'){ev.preventDefault();runPalette(K.idx)}
  else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();closePalette(true)}
  else if(ev.key==='Tab'){ev.preventDefault()}
});
$('klist').addEventListener('pointermove',ev=>{
  const it=ev.target.closest('.kit');
  if(!it)return;
  const i=Number(it.dataset.kIdx);
  if(i!==K.idx){K.idx=i;moveIdx(0)}
});
$('kmenu').addEventListener('mousedown',ev=>{if(ev.target===$('kmenu'))closePalette(true)});
$('kHint').textContent=`${MOD}K`;

$('chart').addEventListener('pointermove',ev=>{
  const col=ev.target.closest('.col');
  if(!col)return;
  const idx=Number(col.dataset.idx);
  if(idx!==tipState.active)showTip(idx);
});
$('chart').addEventListener('pointerleave',hideTip);
$('chart').addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse')return;
  const col=ev.target.closest('.col');
  if(!col)return;
  const idx=Number(col.dataset.idx);

document.addEventListener('click',ev=>{
  if(!$('menu').hidden&&!ev.target.closest('#menu,[data-status-menu]'))closeMenu(false);
  const t=ev.target.closest('button,a,[data-open],[data-evt-open]');if(!t)return;
  if(t.matches('a[data-stop]'))return;
  ui.instant=ev.detail===0;
  if(t.dataset.kIdx!=null)return runPalette(Number(t.dataset.kIdx));
  if(t.dataset.jump)return jumpTo(t.dataset.jump);
  if(t.id==='kOpen')return openPalette();
  if(t.id==='live')return toggleLive();
  if(t.dataset.copyId){
    ev.stopPropagation();
    const text=copyStore.get(t.dataset.copyId);
    if(text!=null)copyText(t,text);
    return;
  }
  if(t.hasAttribute('data-copy-link'))return copyLink();
  if(t.dataset.unblock){ev.stopPropagation();return unblock(t.dataset.unblock,t.dataset.label||t.dataset.unblock,t)}
  if(t.hasAttribute('data-done-toggle')){ui.showDone=!ui.showDone;return renderSignals()}
  if(t.dataset.sig){ui.sig=t.dataset.sig;return renderSignals()}
  if(t.dataset.evt){ui.evt=t.dataset.evt;return renderTraffic(true)}
  if(t.dataset.range){
    ui.range=t.dataset.range;
    try{localStorage.setItem('bouncer.range',ui.range)}catch(e){}
    return renderTraffic(ui.instant);
  }
  if(t.dataset.scroll){ui.scrollTo=t.dataset.scroll;return renderDrawer()}
  if(t.hasAttribute('data-status-menu'))return $('menu').hidden?openStatusMenu():closeMenu(true);
  if(t.dataset.setStatus)return pickStatus(t.dataset.setStatus);
  if(t.hasAttribute('data-close'))return closeDrawer();
  if(t.dataset.open){ev.stopPropagation();return openDrawer({id:t.dataset.open},t.dataset.tab)}
  if(t.dataset.evtOpen)return openDrawer({evt:t.dataset.evtOpen});
});

const typing=el=>el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
function stepSignal(d){
  const rows=[...$('signals').querySelectorAll('.srow')];
  if(!rows.length)return;
  const cur=ui.open&&ui.open.id?rows.findIndex(r=>r.dataset.open===ui.open.id):-1;
  const next=cur<0?(d>0?0:rows.length-1):Math.min(rows.length-1,Math.max(0,cur+d));
  const id=rows[next].dataset.open;
  if(ui.open&&ui.open.id===id)return;
  ui.instant=true;
  openDrawer({id});
  const row=$('signals').querySelector(`.srow[data-open="${CSS.escape(id)}"]`);
  if(row)row.scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown',ev=>{
  const mod=ev.metaKey||ev.ctrlKey;
  if(mod&&!ev.shiftKey&&!ev.altKey&&ev.key.toLowerCase()==='k'){ev.preventDefault();return paletteOpen()?closePalette(true):openPalette()}
  if(mod&&!ev.shiftKey&&!ev.altKey&&ev.key.toLowerCase()==='b'&&!paletteOpen()&&!typing(ev.target)){ev.preventDefault();return toggleSide()}
  if(paletteOpen())return;
  const menu=$('menu');
  if(!menu.hidden){
    const items=[...menu.querySelectorAll('.mi')];
    const i=items.indexOf(document.activeElement);
    if(ev.key==='Escape'){ev.preventDefault();return closeMenu(true)}
    if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();items[(i+(ev.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();return}
    if(/^[1-3]$/.test(ev.key)){ev.preventDefault();return pickStatus(STATUS_ORDER[Number(ev.key)-1])}
    if(ev.key==='Tab'){ev.preventDefault();return}
    return;
  }
  if(mod&&!ev.shiftKey&&ev.key.toLowerCase()==='z'&&lastUndo&&!typing(ev.target)){ev.preventDefault();return lastUndo()}
  if(ev.key==='Escape'&&ui.open){ui.instant=true;return closeDrawer()}
  if(!mod&&!ev.altKey&&!typing(ev.target)){
    if(ev.key==='j'||ev.key==='k'){ev.preventDefault();return stepSignal(ev.key==='j'?1:-1)}
    if((ev.key==='s'||ev.key==='S')&&ui.open&&ui.open.id&&$('statusPick')){ev.preventDefault();return openStatusMenu()}
  }
  if(ev.key==='Tab'&&ui.open&&!$('drawer').hidden&&!DOCK.matches){
    const f=[...$('drawer').querySelectorAll('button,a[href],[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(f.length){
      const first=f[0],last=f[f.length-1];
      if(!$('drawer').contains(document.activeElement)){ev.preventDefault();first.focus()}
      else if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
      else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
    }
  }
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.srow,.erow')){ev.preventDefault();ev.target.click()}
});

window.addEventListener('resize',()=>{if(!$('menu').hidden&&$('statusPick'))placeMenu($('statusPick'))});
$('scrim').addEventListener('click',()=>{ui.instant=false;closeDrawer()});
function toggleLive(){
  ui.live=!ui.live;
  $('live').setAttribute('aria-pressed',String(ui.live));
  if(ui.live){ui.pending=[];sync()}
  updateLive();
}
let wasOff=false;
function updateLive(){
  const n=ui.pending.length;
  const ic=$('liveIc');
  ic.innerHTML=wasOff?L.offline:ui.live?'<span class="pulse"></span>':L.pause;
  $('liveText').innerHTML=wasOff?'Reconnecting…':ui.live?'Live':n?`Paused <span class="live-badge">${fmtN(n)} new</span>`:'Paused';
  const secs=ui.lastSync?Math.round((Date.now()-ui.lastSync)/1000):null;
  $('liveAgo').textContent=wasOff||secs==null?'':secs<5?'synced now':secs<60?`synced ${secs}s ago`:`synced ${shortAgo(ui.lastSync/1000)} ago`;
}

initRange();
syncRange(true);
readHash();
syncDockMode();
renderAll();
scrollSpy();
updateLive();
sync();
setInterval(()=>{if(ui.live){renderSignals();renderTraffic(true)}},30000);
setInterval(()=>{
  updateLive();
  if(!ui.live||!ui.loaded)return;
  if((S.lists||[]).some(x=>leftNow(x)<=0))return soon();
  renderBlocked();
  renderDrawer();
},5000);
setInterval(()=>{if(ui.live&&!document.hidden&&Date.now()-ui.lastSync>55000)sync()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.live&&Date.now()-ui.lastSync>5000)sync()});
const es=new EventSource('stream');
es.onopen=()=>{const hadOff=wasOff;wasOff=false;$('live').classList.remove('off');updateLive();if(hadOff&&ui.live)sync()};
es.onerror=()=>{wasOff=true;$('live').classList.add('off');updateLive()};
es.onmessage=m=>{
  let e;try{e=JSON.parse(m.data)}catch(x){return}
  if(e.kind==='state'){if(ui.live)soon();return}
  if(!ui.live){ui.pending.push(e);return updateLive()}
  if(e.kind!=='fix'&&e.decision!=='fix'){
    const k=evtKey(e);
    if(!arrived.has('e:'+k)&&!(S.recent||[]).some(x=>evtKey(x)===k))arrived.set('e:'+k,Date.now());
  }
  S.recent.push(e);
  if(S.recent.length>400)S.recent.splice(0,S.recent.length-400);
  renderTraffic(true);
  soon();
};
</script>
